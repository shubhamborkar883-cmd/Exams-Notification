name: Daily Maharashtra Exams Tracker

on:
  schedule:
    - cron: '30 0 * * *'  # Runs at 6:00 AM IST daily
  workflow_dispatch:

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/actions-setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Web Scraper Engine
      env:
        # Maps GitHub Secrets safely into Python environment variables
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py

    - name: Commit and Push New Exam Alerts
      run: |
        git config --global user.name "GitHub Action Exam Bot"
        git config --global user.email "action@github.com"
        git add LIVE_EXAM_ALERTS.md
        if ! git diff --cached --quiet; then
          git commit -m "🤖 System Alert: Updated Maharashtra Exam Boards [Skip CI]"
          git push
        else
          echo "No new updates to commit today."
        fi
